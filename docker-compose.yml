services:
  editor:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      AEDIFEX_ADMIN_PASSWORD: ${AEDIFEX_ADMIN_PASSWORD:?Set AEDIFEX_ADMIN_PASSWORD}
      AEDIFEX_PUBLIC_URL: ${AEDIFEX_PUBLIC_URL:-http://localhost:${PORT:-3000}}
      AEDIFEX_SCENE_API_TOKEN: ${AEDIFEX_SCENE_API_TOKEN:-}
      AEDIFEX_DATA_DIR: /data
    volumes:
      - aedifex-data:/data
    restart: unless-stopped

volumes:
  aedifex-data:
